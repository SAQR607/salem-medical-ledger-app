<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — نظام إدارة المدخلات والمخرجات المادية</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Brand -->
        <div class="text-center mb-6">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white shadow-lg font-extrabold text-2xl mb-3">
                ₪
            </div>
            <h1 class="font-bold text-lg text-slate-800">نظام إدارة المدخلات والمخرجات المادية</h1>
            <p class="text-xs text-slate-500 mt-1">سجّل الدخول للوصول إلى بياناتك المالية</p>
        </div>

        <!-- Login card -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <form id="login-form" class="space-y-4">
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-500 mb-1">اسم المستخدم</label>
                    <input type="text" id="username" required autocomplete="username" autofocus
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                           placeholder="مثال: admin">
                </div>
                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-500 mb-1">كلمة المرور</label>
                    <input type="password" id="password" required autocomplete="current-password"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                           placeholder="••••••••">
                </div>

                <div id="login-error" class="hidden text-xs font-bold text-rose-600 bg-rose-50 border border-rose-200 rounded-xl px-3 py-2"></div>

                <button type="submit" id="login-btn"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-60 text-white font-bold py-2.5 rounded-xl transition shadow-sm text-sm">
                    تسجيل الدخول
                </button>
            </form>

            <p id="login-hint" class="text-[11px] text-slate-400 text-center mt-4 leading-relaxed">
                كل مستخدم يرى بياناته فقط. الحسابات تُنشأ من قبل الإدارة.
            </p>
        </div>

        <p class="text-center text-[11px] text-slate-400 mt-4">البيانات مشفّرة — لا يستطيع أحد قراءة بياناتك حتى لو اطّلع على الكود.</p>
    </div>

    <script src="js/config.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/telegram.js"></script>
    <script>
        // Already logged in? Go straight to the app.
        if (Auth.session()) location.replace("index.html");

        var form = document.getElementById("login-form");
        var errBox = document.getElementById("login-error");
        var btn = document.getElementById("login-btn");

        function showError(msg) {
            errBox.textContent = msg;
            errBox.classList.remove("hidden");
        }

        form.addEventListener("submit", async function (e) {
            e.preventDefault();
            errBox.classList.add("hidden");
            btn.disabled = true;
            btn.textContent = "جارٍ التحقق…";
            try {
                var res = await Auth.login(
                    document.getElementById("username").value,
                    document.getElementById("password").value
                );
                if (res.ok) {
                    btn.textContent = "تم — جارٍ الفتح…";
                    // Alert the admin that someone logged in (best-effort, non-blocking).
                    if (typeof Telegram !== "undefined") Telegram.loginAlert(res.session.username, true);
                    setTimeout(function () { location.replace("index.html"); }, 250);
                } else {
                    showError(res.error);
                    btn.disabled = false;
                    btn.textContent = "تسجيل الدخول";
                }
            } catch (err) {
                console.error(err);
                showError("حدث خطأ غير متوقع — تحقق من اتصالك وأعد المحاولة");
                btn.disabled = false;
                btn.textContent = "تسجيل الدخول";
            }
        });
    </script>
</body>
</html>
